[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmem"
version = "0.1.0"
description = "An agentic memory lifecycle system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "pgvector>=0.4,<1.0",
]

[project.optional-dependencies]
llm-openai = ["openai>=1.66,<3.0"]
local = [
    "openai>=1.66,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fluxmem.application.llm.prompts" = ["*.txt"]
