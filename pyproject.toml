[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmem"
version = "0.1.0"
description = "A provider-neutral conversational memory layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "pgvector>=0.4,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fluxmem.application.llm.prompts" = ["*.txt"]
